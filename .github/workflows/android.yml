name: Android CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Write google-services.json
        run: cp ci/google-services.dummy.json app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check code style (ktlint)
        run: ./gradlew ktlintCheck --console=plain

      # One invocation instead of two: each `./gradlew` call re-runs Gradle's configuration
      # phase for all ~27 modules, so running test+assembleDebug together (instead of as
      # separate steps) avoids paying that cost twice.
      - name: Run unit tests and build debug APK
        run: ./gradlew test assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
