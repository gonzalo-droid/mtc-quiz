name: Android CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Replaces setup-java's `cache: 'gradle'`, which keyed the whole ~1.7 GB cache on a
      # hash of every Gradle file — so any build-script edit invalidated it wholesale and
      # runs restored nothing ("gradle cache is not found"). This action caches the
      # dependency, build and configuration caches under finer-grained keys, and by default
      # only writes from the default branch while every branch can read.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        run: cp ci/google-services.dummy.json app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A single invocation for all three checks: every `./gradlew` call re-runs Gradle's
      # configuration phase across the 32 modules, and ktlint was still paying it a second
      # time as its own step (~2 min for a check that is itself near-instant). Gradle stops
      # at the first failing task, so fail-fast is preserved.
      - name: Check style, run tests and build debug APK
        run: ./gradlew ktlintCheck test assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
